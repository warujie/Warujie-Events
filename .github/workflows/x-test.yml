# A one-off test on a work branch (not main): reads the two 高田馬場 shops' X accounts once from a
# fresh state, and looks for them in the published events.json. Commits the log to x_test/.
# Removed before a publish.
name: X reader test

on:
  push:
    branches: ['claude/**']
    paths: [x_test/accounts.json, .github/workflows/x-test.yml]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: R2 (read only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          key=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.id // empty')
          acct=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          secret=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          { echo "AWS_ACCESS_KEY_ID=$key"; echo "AWS_SECRET_ACCESS_KEY=$secret"; echo "AWS_DEFAULT_REGION=auto"; echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required"; echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required"
            echo "R2_ENDPOINT=https://$acct.r2.cloudflarestorage.com"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Read the two accounts once
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p x_test
          ( echo "X token: $([ -n "$X_BEARER_TOKEN" ] && echo set || echo missing); Anthropic key: $([ -n "$ANTHROPIC_API_KEY" ] && echo set || echo missing)"
            pip install -q anthropic
            aws s3 cp "s3://warujie-price-data/events.json" /tmp/events.json --endpoint-url "$R2_ENDPOINT" --only-show-errors
            echo "== already in events.json (Tonamel or others):"
            python3 -c "
          import json; d=json.load(open('/tmp/events.json')); ev=d.get('events', d) if isinstance(d, dict) else d
          import re
          hits=[e for e in ev if re.search('バトロコ|とど|抜忍|todo|batoloco', json.dumps(e, ensure_ascii=False), re.I)]
          print(len(ev), 'events,', len(hits), 'from these shops'); [print(json.dumps(e, ensure_ascii=False)) for e in hits[:40]]"
            echo "== X reader"
            python3 x_reader.py --state x_test/state.json --all --accounts x_test/accounts.json --max-reads 12
          ) > x_test/log.txt 2>&1 || true
          cat x_test/log.txt
      - name: Commit the result to the branch
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add x_test && git commit -qm "X reader test: log and result" && git push || echo "nothing to commit"
