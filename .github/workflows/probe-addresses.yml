name: Probe Tonamel addresses
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-tonamel-addresses'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p probe_out
          ( pip install -q cryptography playwright==1.56.0 && python3 -m playwright install --with-deps chromium >/dev/null && python3 probe/addresses.py ) > probe_out/log.txt 2>&1 || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
