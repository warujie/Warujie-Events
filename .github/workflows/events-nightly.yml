# Local Magic tournaments for warujie.jp's 大会 calendar, read once a night.
#
# build_events.py reads Hareruya's, Amenity Dream's and Yellow Submarine's own event lists
# (the owner's decision, 2026-10-24) and Tonamel's public MTG event search (the owner's request,
# 2026-10-25): only pages their robots.txt allows, one page at a time, 4 seconds apart, with a
# User-Agent naming warujie.jp. Every event links back to the shop's or Tonamel's page. If a site
# asks us to stop, take it out of build_events.py at once.
#
# The result is published to the private R2 bucket (as events.json), which warujie.jp reads
# through its Worker at /data/events.json. If every source fails, nothing is published and
# yesterday's file stays. Nothing is committed. Nothing runs until the repository has the
# CLOUDFLARE_R2_TOKEN secret (docs/README.md, "The secret").

name: Tournament calendar nightly

on:
  schedule:
    - cron: "30 18 * * *"    # 18:30 UTC = 3:30 in Japan, when the shops' sites are quiet
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-nightly
  cancel-in-progress: false

jobs:
  read:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # first, before any shop is read: can we publish at all?
      - name: Check the R2 token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::No CLOUDFLARE_R2_TOKEN secret yet: nothing is read or published (docs/README.md, The secret)."; exit 1; fi
          key=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.id // empty')
          acct=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          if [ -z "$key" ] || [ -z "$acct" ]; then echo "::error::The CLOUDFLARE_R2_TOKEN token is not accepted by Cloudflare."; exit 1; fi
          secret=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          { echo "AWS_ACCESS_KEY_ID=$key"; echo "AWS_SECRET_ACCESS_KEY=$secret"; echo "AWS_DEFAULT_REGION=auto"; echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required"; echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required"
            echo "R2_ENDPOINT=https://$acct.r2.cloudflarestorage.com"; } >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # cryptography for Amenity Dream's certificate; a headless Chromium for Tonamel's search page
      - run: |
          pip install cryptography playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Read the shops' event lists
        run: python3 build_events.py --out site/events.json

      - name: Publish to R2
        run: |
          aws s3 cp site/events.json "s3://warujie-price-data/events.json" --endpoint-url "$R2_ENDPOINT" --content-type "application/json; charset=utf-8" --only-show-errors
          echo "Published events.json ($(stat -c %s site/events.json) bytes)"
