# Local Magic tournaments for warujie.jp's 大会 calendar, read once a night.
#
# build_events.py reads Hareruya's, Amenity Dream's and Yellow Submarine's own event lists
# (the owner's decision, 2026-10-24) and Tonamel's public MTG event search (the owner's request,
# 2026-10-25): only pages their robots.txt allows, one page at a time, 4 seconds apart, with a
# User-Agent naming warujie.jp. Every event links back to the shop's or Tonamel's page. If a site
# asks us to stop, take it out of build_events.py at once.
#
# Shops' calendar pictures are read by hand into manual_events.json (MINT's schedule pages, and
# posts on X the owner hands over), and the pictures of the X accounts listed in x_accounts.json
# automatically by x_reader.py (X's paid API and a Claude model; secrets X_BEARER_TOKEN and
# ANTHROPIC_API_KEY; the owner's request, 2026-10-25), kept in x_events.json in R2; a push that changes manual_events.json on main puts its events
# into the published file at once, without reading any shop again.
#
# The result is published to the private R2 bucket (as events.json), which warujie.jp reads
# through its Worker at /data/events.json. Hareruya's fees come from its event pages, each store's
# recurring event read once and kept in hareruya_fees.json (also in R2) for 30 days. If every shop's source fails, nothing is published and
# yesterday's file stays. Nothing is committed. Nothing runs until the repository has the
# CLOUDFLARE_R2_TOKEN secret (docs/README.md, "The secret").

name: Tournament calendar nightly

on:
  schedule:
    - cron: "30 18 * * *"    # 18:30 UTC = 3:30 in Japan, when the shops' sites are quiet
  workflow_dispatch:
  push:
    branches: [main]
    paths: [manual_events.json]

permissions:
  contents: read

concurrency:
  group: events-nightly
  cancel-in-progress: false

jobs:
  read:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # first, before any shop is read: can we publish at all?
      - name: Check the R2 token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::No CLOUDFLARE_R2_TOKEN secret yet: nothing is read or published (docs/README.md, The secret)."; exit 1; fi
          key=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.id // empty')
          acct=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          if [ -z "$key" ] || [ -z "$acct" ]; then echo "::error::The CLOUDFLARE_R2_TOKEN token is not accepted by Cloudflare."; exit 1; fi
          secret=$(printf %s "$CF_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          { echo "AWS_ACCESS_KEY_ID=$key"; echo "AWS_SECRET_ACCESS_KEY=$secret"; echo "AWS_DEFAULT_REGION=auto"; echo "AWS_REQUEST_CHECKSUM_CALCULATION=when_required"; echo "AWS_RESPONSE_CHECKSUM_VALIDATION=when_required"
            echo "R2_ENDPOINT=https://$acct.r2.cloudflarestorage.com"; } >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # cryptography for Amenity Dream's certificate; a headless Chromium for Tonamel's search page
      - if: github.event_name != 'push'
        run: |
          pip install cryptography playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      # the chosen shops' calendar pictures on X, read automatically (x_reader.py): only with both
      # secrets; yesterday's x_events.json says which posts are already read. A failure here never
      # stops the calendar: the events read before stay.
      - name: Read the chosen shops' pictures on X
        if: github.event_name != 'push'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          aws s3 cp "s3://warujie-price-data/x_events.json" x_events.json --endpoint-url "$R2_ENDPOINT" --only-show-errors || echo "No x_events.json yet"
          if [ -n "$X_BEARER_TOKEN" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install -q anthropic && python3 x_reader.py --state x_events.json || echo "::warning::x_reader.py failed; yesterday's X events stay"
          else echo "No X_BEARER_TOKEN or ANTHROPIC_API_KEY secret: X is not read"; fi

      # Hareruya's fees: yesterday's cache, so each event page is read once (none yet on the first night)
      - name: Read the shops' event lists
        if: github.event_name != 'push'
        run: |
          aws s3 cp "s3://warujie-price-data/hareruya_fees.json" hareruya_fees.json --endpoint-url "$R2_ENDPOINT" --only-show-errors || echo "No fee cache yet"
          python3 build_events.py --out site/events.json --fees hareruya_fees.json --x-events x_events.json

      # manual_events.json changed: only its events change in the published file
      - name: Update the events read from calendar pictures
        if: github.event_name == 'push'
        run: |
          aws s3 cp "s3://warujie-price-data/events.json" published.json --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "s3://warujie-price-data/x_events.json" x_events.json --endpoint-url "$R2_ENDPOINT" --only-show-errors || echo "No x_events.json yet"
          python3 build_events.py --out site/events.json --manual-only published.json --x-events x_events.json

      - name: Publish to R2
        run: |
          aws s3 cp site/events.json "s3://warujie-price-data/events.json" --endpoint-url "$R2_ENDPOINT" --content-type "application/json; charset=utf-8" --only-show-errors
          echo "Published events.json ($(stat -c %s site/events.json) bytes)"
          if [ -s x_events.json ] && [ "${{ github.event_name }}" != push ]; then aws s3 cp x_events.json "s3://warujie-price-data/x_events.json" --endpoint-url "$R2_ENDPOINT" --content-type "application/json; charset=utf-8" --only-show-errors; fi
          if [ -s hareruya_fees.json ]; then aws s3 cp hareruya_fees.json "s3://warujie-price-data/hareruya_fees.json" --endpoint-url "$R2_ENDPOINT" --content-type "application/json; charset=utf-8" --only-show-errors; fi
